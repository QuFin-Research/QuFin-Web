title = "QuFin secret scan"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures and example values, never real credentials"
paths = [
  '''services/api/tests/''',
  '''\.env\.example$''',
  '''env\.example\.txt$''',
  '''package-lock\.json$''',
  '''uv\.lock$''',
]

# Public series identifiers that look like keys to the generic rule (a FRED series id, not a credential).
regexes = [
  '''COMREPUSQ159N''',
]
