            --ai-purple: #8b5cf6;
            --data-green: #10b981;
            --risk-orange: #f59e0b;
            --dark-bg: #0f172a;
            --dark-card: #1e293b;
            --dark-text: #f1f5f9;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
        }
        
        .dark body {
            background-color: var(--dark-bg);
            color: var(--dark-text);
        }
        
        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.7;
        }
        
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(5, 55, 78, 0.8) 0%, rgba(14, 165, 233, 0.6) 50%, rgba(139, 92, 246, 0.6) 100%);
            z-index: 1;
        }
        
        .hero-content {
            position: relative;
            z-index: 2;
        }
        
        .feature-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
        }
        
        .dark .feature-card {
            background: var(--dark-card);
            border-color: #334155;
        }
        
        .feature-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        .dark .feature-card:hover {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
        }
        
        .ai-product-card {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            border-left: 4px solid var(--quantum-blue);
            transition: all 0.3s ease;
        }
        
        .dark .ai-product-card {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
        }
        
        .ai-product-card:hover {
            transform: translateX(5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        
        .metric-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .accuracy {
            background: rgba(16, 185, 129, 0.1);
            color: var(--data-green);
        }
        
        .speed {
            background: rgba(14, 165, 233, 0.1);
            color: var(--quantum-blue);
        }
        
        .risk {
            background: rgba(245, 158, 11, 0.1);
            color: var(--risk-orange);
        }
        
        .market-metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .dark .market-metric {
            border-bottom-color: #334155;
        }
        
        .market-metric:last-child {
            border-bottom: none;
        }
        
        .positive {
            color: #10b981;
        }
        
        .negative {
            color: #ef4444;
        }
        
        .mega-menu {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-radius: 0 0 12px 12px;
            padding: 24px;
            display: none;
            z-index: 1000;
        }
        
        .dark .mega-menu {
            background: var(--dark-card);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        
        .nav-item:hover .mega-menu {
            display: block;
        }
        
        .nav-categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
        }
        
        .nav-category h4 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--quantum-blue);
        }
        
        .nav-category ul {
            list-style: none;
        }
        
        .nav-category li {
            margin-bottom: 8px;
        }
        
        .nav-category a {
            color: #64748b;
            text-decoration: none;
            transition: color 0.2s;
        }
        
        .dark .nav-category a {
            color: #94a3b8;
        }
        
        .nav-category a:hover {
            color: var(--quantum-blue);
        }

            position: relative;
            width: 100%;
            height: 600px;
            background: #f8fafc;
            border-radius: 12px;
            overflow: hidden;
        }
        
        .dark .world-map-container {
            background: #1e293b;
        }

            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }
        
        .map-btn {
            padding: 8px 16px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .dark .map-btn {
            background: #334155;
            border-color: #475569;
            color: white;
        }
        
        .map-btn:hover {
            background: #f1f5f9;
            transform: translateY(-1px);
        }
        
        .dark .map-btn:hover {
            background: #475569;
        }
        
        .map-btn.active {
            background: var(--quantum-blue);
            color: white;
            border-color: var(--quantum-blue);
        }
        
        .country-tooltip {
            position: absolute;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            border-radius: 8px;
            pointer-events: none;
            font-size: 14px;
            z-index: 100;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 250px;
            line-height: 1.5;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }

            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            background: #f8fafc;

        .dark .signal-item {
            background: #334155;
        }
        
        .signal-item.buy {
            border-left: 4px solid #10b981;
        }
        
        .signal-item.sell {
            border-left: 4px solid #ef4444;
        }
        
        .signal-item.hold {
            border-left: 4px solid #f59e0b;
        }
        
        .confidence-bar {
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 4px;
        }
        
        .dark .confidence-bar {
            background: #475569;
        }
        
        .confidence-fill {
            height: 100%;
            border-radius: 2px;
        }
        
        .buy .confidence-fill {
            background: #10b981;
        }
        
        .sell .confidence-fill {
            background: #ef4444;
        }
        
        .hold .confidence-fill {
            background: #f59e0b;
        }

            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 4px;
        }
        
        .dark .skeleton-loader {
            background: linear-gradient(90deg, #334155 25%, #475569 50%, #334155 75%);
            background-size: 200% 100%;
        }
        
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

            background: linear-gradient(135deg, var(--quantum-blue), var(--ai-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

            .mega-menu {

                box-shadow: none;
                border-radius: 0;
                padding: 16px;
            }

                grid-template-columns: 1fr;
            }
            
            .hero-metrics {
                flex-direction: column;
                gap: 16px;
            }

            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        
        .auth-modal.open {
            display: flex;
        }
        
        .auth-container {
            background: white;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        .dark .auth-container {
            background: var(--dark-card);
        }
        
        .theme-toggle-btn {
            padding: 8px;
            border-radius: 50%;
            background: none;
            border: none;
            cursor: pointer;
            color: #64748b;
            transition: all 0.3s;
        }
        
        .theme-toggle-btn:hover {
            background: rgba(0, 0, 0, 0.05);
            color: #0f172a;
        }
        
        .dark .theme-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
        }
        
        .data-pipeline {
            position: relative;
            height: 300px;
            background: #f8fafc;
            border-radius: 12px;
            overflow: hidden;
        }
        
        .dark .data-pipeline {
            background: #1e293b;
        }
        
        .pipeline-node {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            z-index: 2;
        }
        
        .pipeline-connection {
            position: absolute;
            height: 4px;
            background: #0ea5e9;
            z-index: 1;
        }
        
        .pipeline-animation {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #8b5cf6;
            border-radius: 50%;
            z-index: 3;
            animation: flow 8s linear infinite;
        }
        
        @keyframes flow {
            0% { transform: translateX(0); }
            100% { transform: translateX(100%); }
        }
    </style>

                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
