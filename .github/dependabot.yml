version: 2
updates:
  - package-ecosystem: uv
    directory: /services/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Node types must match the oldest Node the app supports (22, as in CI and the README):
      # a newer major would accept APIs that break on Node 22.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
